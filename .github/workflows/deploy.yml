name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let this workflow publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes cancel in-flight runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check translations are in sync
        run: npm run i18n:check
      - name: Check copy for AI-writing tells
        run: npm run writing:check
      - name: Check the Japanese font subset covers the Japanese copy
        run: npm run fonts:check
      - name: Check the roadmap has not sailed past its own dates
        run: npm run roadmap:check
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://digiboom.biz
      # Jekyll would hide the _next folder — disable it
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
