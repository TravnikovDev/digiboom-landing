<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>DigiBoom</title>
    <link rel="canonical" href="https://digiboom.biz/en/" />
    <!-- No-JS fallback: send crawlers and script-less browsers to the default locale. -->
    <noscript><meta http-equiv="refresh" content="0; url=/en/" /></noscript>
    <script>
      // Static export produces one page per locale (/en/, /de/, ...) but no "/" page.
      // This file fills that gap: pick the visitor's language once, then hand off.
      (function () {
        var SUPPORTED = ["en", "de", "fr", "es"];
        var DEFAULT = "en";
        function pick() {
          try {
            var saved = localStorage.getItem("digiboom-locale");
            if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;
          } catch (e) {}
          var langs = navigator.languages || [navigator.language || DEFAULT];
          for (var i = 0; i < langs.length; i++) {
            var code = String(langs[i] || "").toLowerCase().split("-")[0];
            if (SUPPORTED.indexOf(code) !== -1) return code;
          }
          return DEFAULT;
        }
        location.replace("/" + pick() + "/");
      })();
    </script>
  </head>
  <body>
    <a href="/en/">Continue to DigiBoom</a>
  </body>
</html>
